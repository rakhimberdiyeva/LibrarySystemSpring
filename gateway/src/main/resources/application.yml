server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 3000
            response-timeout: 15s
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
                allowed-methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
                allowed-headers: "*"
                allow-credentials: true
                max-age: 3600
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
          routes:
            - id: auth-service-docs
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/v3/api-docs
              filters:
                - RewritePath=/api/auth/v3/api-docs, /v3/api-docs
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/**, /api/members/**, /api/admin/members/**
            - id: catalog-service-docs
              uri: ${CATALOG_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/catalog/v3/api-docs
              filters:
                - RewritePath=/api/catalog/v3/api-docs, /v3/api-docs
            - id: catalog-service
              uri: ${CATALOG_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/books/**, /api/authors/**, /api/admin/books/**, /api/admin/authors/**
            - id: loan-service-docs
              uri: ${LOAN_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/loan/v3/api-docs
              filters:
                - RewritePath=/api/loan/v3/api-docs, /v3/api-docs
            - id: loan-service
              uri: ${LOAN_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/loans/**, /api/admin/loans/**
            - id: media-service-docs
              uri: ${MEDIA_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/media/v3/api-docs
              filters:
                - RewritePath=/api/media/v3/api-docs, /v3/api-docs
            - id: media-service
              uri: ${MEDIA_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/media/**, /api/admin/media/**


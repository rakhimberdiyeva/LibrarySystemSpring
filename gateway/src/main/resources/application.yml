gateway:
  security:
    public-paths:
      - /api/auth/login
      - /api/auth/register
      - /api/auth/refresh
      - /api/*/v3/api-docs
      - GET:/api/books/**
      - GET:/api/authors/**
    role-rules:
      - path: /api/admin/**
        roles: [ROLE_ADMIN]

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    urls:
      - name: auth-service
        url: /api/auth/v3/api-docs
      - name: catalog-service
        url: /api/catalog/v3/api-docs
      - name: loan-service
        url: /api/loan/v3/api-docs
      - name: media-service
        url: /api/media/v3/api-docs